<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive</title>
  <style>
    :root {
      --black: #1A1A1A; --white: #FFFFFF; --accent: #D82C2C;
      --mid-grey: #6A6A6A; --off-white: #F4F3EE;
      --font-sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem;
      --text-lg: 1.563rem; --text-xl: 1.953rem;
      --weight-light: 300; --weight-regular: 400; --weight-medium: 500; --weight-bold: 700;
      --leading-body: 1.6; --leading-tight: 1.0;
      --tracking-tight: -0.02em; --tracking-upper: 0.05em; --tracking-normal: 0;
      --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 24px; --space-6: 32px; --space-8: 48px;
      --grid-gap: 2px; --max-width: 1400px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--weight-regular);
      line-height: var(--leading-body);
      color: var(--black);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--grid-gap);
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-5);
    }
    /* Header */
    .archive-header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: var(--space-4) 0;
      border-bottom: 2px solid var(--black);
      margin-bottom: var(--space-6);
    }
    .archive-header h1 {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      letter-spacing: var(--tracking-tight);
    }
    .archive-header .count {
      font-size: var(--text-xs);
      color: var(--mid-grey);
      letter-spacing: var(--tracking-upper);
      text-transform: uppercase;
    }
    /* Filter bar */
    .filters {
      grid-column: 1 / -1;
      display: flex;
      gap: var(--space-4);
      padding-bottom: var(--space-4);
      margin-bottom: var(--space-4);
      border-bottom: 1px solid var(--off-white);
      flex-wrap: wrap;
    }
    .filters a {
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-upper);
      text-transform: uppercase;
      text-decoration: none;
      color: var(--mid-grey);
      padding: var(--space-2) 0;
    }
    .filters a:hover,
    .filters a.active {
      color: var(--black);
      border-bottom: 2px solid var(--black);
    }
    /* Archive item */
    .archive-item {
      position: relative;
      overflow: hidden;
      background: var(--off-white);
    }
    .archive-item:nth-child(7n+1) { grid-column: span 3; grid-row: span 2; }
    .archive-item:nth-child(7n+2) { grid-column: span 2; grid-row: span 1; }
    .archive-item:nth-child(7n+3) { grid-column: span 1; grid-row: span 1; }
    .archive-item:nth-child(7n+4) { grid-column: span 2; grid-row: span 2; }
    .archive-item:nth-child(7n+5) { grid-column: span 1; grid-row: span 1; }
    .archive-item:nth-child(7n+6) { grid-column: span 3; grid-row: span 1; }
    .archive-item:nth-child(7n+7) { grid-column: span 2; grid-row: span 1; }
    .archive-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .archive-item:hover img {
      transform: scale(1.03);
    }
    .archive-item .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--space-3);
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: var(--white);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .archive-item:hover .overlay {
      opacity: 1;
    }
    .archive-item .overlay .title {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      line-height: var(--leading-tight);
    }
    .archive-item .overlay .meta {
      font-size: var(--text-xs);
      opacity: 0.7;
      margin-top: var(--space-2);
    }
    /* Footer */
    .archive-footer {
      grid-column: 1 / -1;
      padding: var(--space-6) 0;
      border-top: 2px solid var(--black);
      margin-top: var(--space-6);
      font-size: var(--text-xs);
      color: var(--mid-grey);
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 1023px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 2px; padding: var(--space-4); }
      .archive-item:nth-child(7n+1) { grid-column: span 2; grid-row: span 2; }
      .archive-item:nth-child(7n+2) { grid-column: span 1; grid-row: span 1; }
      .archive-item:nth-child(7n+3) { grid-column: span 1; grid-row: span 1; }
      .archive-item:nth-child(7n+4) { grid-column: span 2; grid-row: span 1; }
      .archive-item:nth-child(7n+5) { grid-column: span 1; grid-row: span 1; }
      .archive-item:nth-child(7n+6) { grid-column: span 2; grid-row: span 1; }
      .archive-item:nth-child(7n+7) { grid-column: span 1; grid-row: span 1; }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 2px; padding: var(--space-2); }
      .archive-item:nth-child(n) { grid-column: span 1; grid-row: span 1; }
      .archive-header { flex-direction: column; gap: var(--space-2); }
    }
  </style>
</head>
<body>

</body>
